# forseti crew — E2E harness shape (6A-1): the crew file itself carries the
# assertions. Checks run in the crew cwd after their after-node settles;
# any failure flips the process exit code — CI-able without external glue.
# Run: forseti-crew run -f crew-checks.yaml --headless --session sandbox
name: demo-planner-builder-checked

agents:
  - name: planner
    kind: pi
    model: halogen/halogen-qwen3.8-flash-next
    prompt: |
      You are the planner in a two-agent crew. Do NOT edit any files.
      Produce a numbered plan (max 5 steps, one line each) to add a file
      named HELLO_CREW.md to the repo root containing the line
      "crew pipeline works". End your reply with the single word PLAN_READY.

  - name: builder
    kind: pi
    model: halogen/halogen-qwen3.8-flash-next
    prompt: |
      You are the coder in a two-agent crew. Execute this plan exactly,
      touching only what it names:

      {{ .planner }}

      When done, reply with the single word DONE.

edges:
  - from: planner
    to: builder
    when: re:PLAN_READY

# checks (6A-1): shell assertions, run in the crew cwd, exit 0 = pass.
checks:
  - after: planner
    run: "grep -q PLAN_READY .forseti/bus/planner.md"
  - after: builder
    run: "test -f HELLO_CREW.md && grep -q 'crew pipeline works' HELLO_CREW.md"

# watch (6C-1): advisory pattern events (never fail the run)
watch:
  - node: builder
    match: "DONE"
