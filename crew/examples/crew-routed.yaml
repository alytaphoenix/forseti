# forseti crew — routed pool demo (6D/18C): agents share switchyard routes.
#
# Provider status (2026-10-05): the LAN box rebranded halogen→valhalla and the
# opencode-go key returns 402 Insufficient funds, so no gate can lean on the
# capable tier. The crew file stays pinned; the free path is the efficient tier.
#
# Requires: a router (built `host/` → forseti-host, or cargo-installed
# switchyard-server), and pi provider entries (materialized by the runner).
name: demo-routed-pool

routes:
  - id: auto-pool
    type: stage_router
    efficient: valhalla/valhalla-flash-next
    capable: opencode-go/glm-5.3-flash
    picker: efficient_first
    confidence: 0.5

agents:
  - name: scout-a
    kind: pi
    route: auto-pool
    prompt: |
      Reply with exactly: ROUTE_A_OK and nothing else.
  - name: scout-b
    kind: pi
    route: auto-pool
    prompt: |
      Reply with exactly: ROUTE_B_OK and nothing else.
