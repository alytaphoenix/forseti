# forseti crew — routed pool demo (6D/18C): agents share switchyard routes.
#
# Provider status (2026-10-17): both tiers point at FREE OpenCode Go ids
# (beam-free, longcat-2.5-preview-free) — the paid ids are unfunded and the LAN
# box is reserved for clustering work, so this crew runs with no LAN dependency.
#
# Requires: a router (built `host/` → forseti-host, or cargo-installed
# switchyard-server), and pi provider entries (materialized by the runner).
name: demo-routed-pool

routes:
  - id: auto-pool
    type: stage_router
    efficient: opencode-go/beam-free
    capable: opencode-go/longcat-2.5-preview-free
    picker: efficient_first
    confidence: 0.5

agents:
  - name: scout-a
    kind: pi
    route: auto-pool
    prompt: |
      Reply with exactly: ROUTE_A_OK and nothing else.
  - name: scout-b
    kind: pi
    route: auto-pool
    prompt: |
      Reply with exactly: ROUTE_B_OK and nothing else.
