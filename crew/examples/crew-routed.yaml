# forseti crew — routed pool demo (6D/18C): agents share switchyard routes.
#
# Provider status (2026-10-18): both tiers point at OpenRouter's free
# meta-model (it picks an available free upstream per request: fixed free ids
# hit upstream 429s). NOTE the doubled provider: a switchyard target is split at the
# FIRST slash into llm_client/model, so an OpenRouter model id (which itself
# contains a slash) must be written `openrouter/openrouter/free`. OpenCode Go's
# free ids are NOT usable through the router at all: pi only emits the
# x-opencode-session header for opencode providers, so routed calls 400 with
# MissingSessionID (S46).
#
# Requires: a router (built `host/` → forseti-host, or cargo-installed
# switchyard-server), and pi provider entries (materialized by the runner).
name: demo-routed-pool

routes:
  - id: auto-pool
    type: stage_router
    efficient: openrouter/openrouter/free
    capable: openrouter/openrouter/free
    picker: efficient_first
    confidence: 0.5

agents:
  - name: scout-a
    kind: pi
    route: auto-pool
    prompt: |
      Reply with exactly: ROUTE_A_OK and nothing else.
  - name: scout-b
    kind: pi
    route: auto-pool
    prompt: |
      Reply with exactly: ROUTE_B_OK and nothing else.
