# Hybrid: the agentic graph does the work; repo-mode gates fence the
# irreversible boundaries. This is the recommended default for a project.
#
#   forseti-flow validate -f crew/examples/flow-hybrid.yaml --explain
#
version: 1
name: flow-hybrid
mode: hybrid

defaults:
  severity: warn
  max_continues: 2
  max_cycles: 2
  timeout: 10m

evidence:
  plan_artifact:
    kind: artifact
    file: PLAN.md

  tests:
    kind: shell
    run: "go test ./..."
    timeout: 5m
    within: 30m

  docs_touched:
    kind: diff
    changed: ["docs/**", "README.md", "AGENTS.md"]

  no_generated:
    kind: diff
    unchanged: ["**/*.gen.go", "**/dist/**"]
    severity: block

  review_lgtm:
    kind: review
    role: reviewer
    criteria: "Correctness, tests, docs drift, and scope creep. LGTM only if no blocking defect remains."
    inputs: [diff]
    verdict: {file: ".forseti/out/review.md", labels: [lgtm, lbtm]}
    model: opencode-go/beam-free
    timeout: 5m

on:
  pre_tool:
    deny:
      - match: "bash:git push --force"
        reason: "force-push is forbidden by this flow"
      - match: "bash:rm -rf"
  post_turn:
    require: [docs_touched]
    severity: warn
  pre_commit:
    require: [tests, no_generated]
    severity: block
  pre_push:
    require: [tests, review_lgtm]
    severity: block

phases:
  - id: plan
    actor: agent
    role: planner
    prompt: "Read the request and write PLAN.md: scope, non-goals, and a test plan."
    produce: [plan]
    gate: {require: [plan_artifact]}

  - id: implement
    actor: agent
    from: [plan]
    prompt: "Implement {{ plan }}. Keep the diff minimal and update the docs."
    gate: {require: [tests]}

  - id: review
    actor: reviewer
    from: [implement]
    role: reviewer
    criteria: "Correctness, tests, docs drift, and scope creep."
    verdict: {lgtm: commit, lbtm: implement}
    max_visits: 2

  - id: commit
    actor: shell
    from: [review]
    run: "git commit -am implement"
    gate: {require: [tests, review_lgtm]}

waivers:
  enabled: true
  reason_required: true
  ledger: .forseti/waivers.jsonl
  ttl: 24h
  never: [no_generated]
