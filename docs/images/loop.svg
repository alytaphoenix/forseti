<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="larr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#0d1117"/>
  <text x="460" y="36" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="bold">the whole loop</text>

  <!-- 1 -->
  <g>
    <rect x="60" y="80" width="260" height="90" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
    <text x="190" y="104" text-anchor="middle" fill="#f78166" font-size="13" font-weight="bold">1 · bring up</text>
    <text x="190" y="126" text-anchor="middle" fill="#c9d1d9" font-size="11">herdr plugin action invoke</text>
    <text x="190" y="144" text-anchor="middle" fill="#c9d1d9" font-size="11">forseti.open</text>
    <text x="190" y="162" text-anchor="middle" fill="#8b949e" font-size="10">→ ded­icated tab: ttt + pi pane (idempotent)</text>
  </g>

  <!-- 2 -->
  <g>
    <rect x="470" y="80" width="260" height="90" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
    <text x="600" y="104" text-anchor="middle" fill="#7ee787" font-size="13" font-weight="bold">2 · ask</text>
    <text x="600" y="126" text-anchor="middle" fill="#c9d1d9" font-size="11">select code → ctrl+k a, or type a</text>
    <text x="600" y="144" text-anchor="middle" fill="#c9d1d9" font-size="11">question in the Forseti input row</text>
    <text x="600" y="162" text-anchor="middle" fill="#8b949e" font-size="10">context: file + lines + selection auto-attached</text>
  </g>

  <!-- 3 -->
  <g>
    <rect x="650" y="250" width="240" height="90" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="770" y="274" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="bold">3 · pi answers</text>
    <text x="770" y="296" text-anchor="middle" fill="#c9d1d9" font-size="11">pane auto-focuses, answer streams</text>
    <text x="770" y="314" text-anchor="middle" fill="#8b949e" font-size="10">(glm-5.3-flash via OpenCode Go)</text>
  </g>

  <!-- 4 -->
  <g>
    <rect x="470" y="360" width="260" height="90" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="600" y="384" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="bold">4 · pi edits</text>
    <text x="600" y="406" text-anchor="middle" fill="#c9d1d9" font-size="11">follow: jump per edit (exact line)</text>
    <text x="600" y="424" text-anchor="middle" fill="#8b949e" font-size="10">review: collect the turn, summary tab</text>
  </g>

  <!-- 5 -->
  <g>
    <rect x="100" y="360" width="280" height="90" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="240" y="384" text-anchor="middle" fill="#e3b341" font-size="13" font-weight="bold">5 · you review in ttt</text>
    <text x="240" y="406" text-anchor="middle" fill="#c9d1d9" font-size="11">editor lands on the changed line,</text>
    <text x="240" y="422" text-anchor="middle" fill="#c9d1d9" font-size="11">hunk highlighted · Review tab lists all</text>
  </g>

  <!-- arrows -->
  <path d="M 320 125 L 466 125" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#larr)"/>
  <path d="M 640 174 C 680 210 700 230 720 246" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#larr)"/>
  <path d="M 700 344 C 690 352 680 356 672 356" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#larr)"/>
  <path d="M 466 400 L 384 402" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#larr)"/>
  <path d="M 210 356 C 180 320 170 260 172 176" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#larr)"/>

  <text x="460" y="270" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">herdr is the hub ·</text>
  <text x="460" y="292" text-anchor="middle" fill="#8b949e" font-size="11">state files + /exec are the spokes</text>
</svg>
