[package]
name = "forseti-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Forseti host: in-process switchyard router + the crew engine (Phase 18D)"
license = "MIT"

[lib]
name = "forseti_host"
path = "src/lib.rs"

[dependencies]
# Embeddable switchyard server library (Phase 18A). Verified surface:
#   switchyard_server::config::load_server_state(path) -> ServerState
#   ServerState::from_runner / with_routing_log / models
#   BoundServer::bind(state, ServerRunOptions) -> .local_addr() / .serve(shutdown)
#   ServerRunOptions { addr, backlog, dry_run, shutdown_timeout, tls }
switchyard-server = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Phase 18D: the crew schema. serde_norway is the maintained serde_yaml fork (the
# same 0.9 API); the crew file is YAML, and the Go engine is the oracle for what
# a valid crew means (scripts/crew-host-oracle.py).
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
regex = "1"
# Phase 18D-3: the herdr JSON socket API speaks serde_json values (the Go
# client passes `any` to encoding/json); 18D-5's run log is JSONL too.
serde_json = "1"
# 18D-4: checks run under a process group so the timeout sweeps grandchildren
# (the Go engine's `Setpgid: true`, P13 BUG-08); libc::kill reaches the group.
libc = "0.2"
# 18D-5c: the memory (127.0.0.1:8752) and laya (127.0.0.1:8751) services are
# loopback JSON-over-HTTP. reqwest is already in the tree via switchyard-server;
# only the blocking + json surfaces are added, no TLS needed for loopback.
reqwest = { version = "0.13", features = ["blocking", "json"], default-features = false }

[[bin]]
name = "forseti-host"
path = "src/main.rs"
